/*
 * compileSdk 36 and Android Gradle plugin 8.9.1 are above what React Native
 * 0.76.2 ships (34 and 8.6.0). The Meta adapter's Audience Network SDK depends
 * on androidx.browser 1.9.0, which requires both. targetSdk is unchanged.
 */
buildscript {
    ext {
        buildToolsVersion = "36.0.0"
        minSdkVersion = 24
        compileSdkVersion = 36
        targetSdkVersion = 34
        ndkVersion = "26.1.10909125"
        kotlinVersion = "2.1.20"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle:8.9.1")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
    }
}

apply plugin: "com.facebook.react.rootproject"

allprojects {
    buildscript {
        dependencies {
            classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:${rootProject.ext.kotlinVersion}")
        }
    }
    repositories {
        // Required by io.cloudx:adapter-mintegral — the Mintegral SDK is hosted
        // outside of Maven Central. Consumers of cloudx-react-native must add
        // this repository when integrating the Mintegral adapter.
        maven { url "https://dl-maven-android.mintegral.com/repository/mbridge_android_sdk_oversea" }
        // Required by io.cloudx:adapter-verve — Verve HyBid SDK artifacts are
        // hosted on Verve's Maven repository. Consumers of cloudx-react-native
        // must add this repository when integrating the Verve adapter.
        maven { url "https://verve.jfrog.io/artifactory/verve-gradle-release" }
        // Required by io.cloudx:adapter-taurusx: the TaurusX SDK is hosted on TaurusX's Maven repository.
        maven { url "https://artifact.taurusx.com/artifactory/taurusx-sdk/" }
        // Required by io.cloudx:adapter-pangle: the Pangle SDK is hosted on ByteDance's Maven repository.
        maven { url "https://artifact.bytedance.com/repository/pangle" }
    }
    configurations.all {
        resolutionStrategy.eachDependency { details ->
            if (details.requested.group == 'org.jetbrains.kotlin') {
                details.useVersion(rootProject.ext.kotlinVersion)
            }
        }
    }
}
